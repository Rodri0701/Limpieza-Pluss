<app-navar [tipoAppContainer]="'nosotros'"/>

<!-- Asi es como se muestra en el template -->
<!-- CONTENEDOR GENERAL -->
<div class="container-general" >
 <!-- Con el for se manda hablar el array de servicios -->
  <!-- Por cada elemento en el array se agrega una tarjeta -->
   <!-- Para cada cambio de diseño, es en el template -->
    @for(servicio of servicios; track servicio) {
    <app-tarjetas-info
        [tipoTarjeta]="'informativo'"
        [titulo]="servicio.titulo"
        [descripcion]="servicio.descripcion"
        [imagen]="servicio.imagen"
        [pieDePagina]="servicio.pieDePagina"
    />
        }
    
</div>
    
<!-- Fin del contenedor general -->
