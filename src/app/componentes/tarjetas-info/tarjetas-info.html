<div [ngClass]="tipoTarjeta">

    <img 
        [src]="imagen"
        [alt]="titulo"
        [ngClass]="tipoTarjeta + '-imagen'"
    >

    <div [ngClass]="tipoTarjeta + '-contenido'">

        <h2 class="tarjeta-titulo">
            {{ titulo }}
        </h2>

        <p class="tarjeta-descripcion">
            {{ descripcion }}
        </p>

        <div class="pie-de-pagina">
            {{ pieDePagina }}
        </div>

    </div>

</div>
