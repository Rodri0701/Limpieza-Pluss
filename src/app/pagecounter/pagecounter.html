<H1 id="Titulo-Counter">Page Counter</H1>

<p id="parrafo"> Pagina para crear los botones de contador</p>

<p id="count">Count: {{ count }}</p>

<button id="increment-btn" (click)="increment()">Increment</button>
<button id="decrement-btn" (click)="decrement()">Decrement</button>
<button id="multiply-btn" (click)="multiply(2)">Multiply by 2</button>
<button id="reset-btn" (click)="reset()">Reset</button>
<button id="divide-btn" (click)="divide(2)">Divide by 2</button>
<br>
<button id="btnHero" routerLink="/hero">Ir a Hero</button>
